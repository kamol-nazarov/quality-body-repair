server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/qbr;

    # The host terminates TLS. Keep redirects relative so they stay on
    # https://qualitybodyrepair.com instead of the container's http port.
    absolute_redirect off;
    port_in_redirect off;
    rewrite ^/(.+)/$ /$1 permanent;

    location = / {
        try_files /index.html =404;
        expires -1;
    }

    location = /index.html {
        expires -1;
    }

    location ^~ /assets/ {
        try_files $uri =404;
        expires 30d;
    }

    location ^~ /.well-known/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/index.html =404;
        expires -1;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    location ~* /\.(?!well-known) {
        return 444;
    }

    location ~* \.php$ {
        return 444;
    }
}
